name: little_steps
description: LittleSteps — Baby memory app
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_app_check: ^0.3.1+4
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  cloud_functions: ^5.1.3

  # State management & navigation
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7

  # Google sign-in
  google_sign_in: ^6.2.1

  # ML Kit
  google_mlkit_image_labeling: ^0.13.0

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  flutter_image_compress: ^2.2.0

  # Local cache
  hive_flutter: ^1.1.0

  # PDF
  pdf: ^3.10.8
  printing: ^5.12.0

  # Charts
  fl_chart: ^0.68.0

  # Encryption
  encrypt: ^5.0.3

  # Utilities
  intl: ^0.20.1
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  share_plus: ^13.1.0
  uuid: ^4.4.2
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  logger: ^2.3.0
  connectivity_plus: ^6.0.3
  geocoding: ^3.0.0
  flutter_local_notifications: ^18.0.1

  # Audio
  record: ^6.0.0
  audioplayers: ^6.0.0

  # HTTP & info
  http: ^1.2.1
  package_info_plus: ^10.1.0

  # Home widget & preferences
  home_widget: ^0.6.0
  shared_preferences: ^2.3.2

  # UI
  flutter_staggered_grid_view: ^0.7.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  image_cropper: ^8.0.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_native_splash:
  color: "#6C3FC5"
  color_dark: "#6C3FC5"
  android_12:
    image: assets/images/app_icon.png
    color: "#6C3FC5"
    icon_background_color: "#6C3FC5"
  web: false

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#6C3FC5"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic

  assets:
    - assets/images/
    - assets/animations/
    - assets/fonts/
